# octabam is a scripts + Makefile project, not an installable package. Build
# and analysis tools run on bare python3 with the stdlib; base dependencies stay
# empty. The optional `emu` extra serves the ColdFire emulator (unicorn), remixer
# frontend (textual), panel audio (sounddevice), measurement probes (numpy), and
# exclusive claim-free physical panel mirror/probe (pyusb, plus native libusb).
# Tooling prefers this venv and falls back to bare python3; optional interactive
# views and physical probes report missing dependencies when invoked.
#
#   uv sync --extra emu     # or: make emu-setup
#
[project]
name = "octabam"
version = "0.1.0.dev0"
description = "A remixer for the Elektron Octatrack's OS: community modifications and custom DSP effects composed into one image"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
emu = [
    "unicorn>=2.1",
    "textual>=0.80",
    # exclusive claim-free physical panel mirror (tools/panel, tools/hw)
    "pyusb>=1.3.1",
    # the panel's audio output device (tools/panel, CoreAudio through PortAudio)
    "sounddevice>=0.5.6",
    # the harness's measurement tools (abkit, station_laws, click_scan,
    # clock_probe, cfmeter) and tools/hw's soak/ladder/usb probes
    "numpy>=1.24",
]

[tool.uv]
# Virtual project: do not try to build/install octabam itself, just manage the
# environment its scripts run in.
package = false
